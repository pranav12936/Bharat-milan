openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification

servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations

  - name: dashboard
    description: Authenticated dashboard summaries

  - name: profiles
    description: Profile discovery and profile management

  - name: profileSetup
    description: Multi-step profile onboarding

  - name: interests
    description: Expressing and managing interest

  - name: reports
    description: Profile safety reports

  - name: photos
    description: Profile photo management

  - name: admin
    description: Admin moderation tools

paths:

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"


  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the current user's dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /profile/setup:
    get:
      operationId: getProfileSetup
      tags: [profileSetup]
      summary: Get the current user's profile setup progress
      description: >
        Returns the user's onboarding progress, saved profile information,
        partner preferences and photo status.
      responses:
        "200":
          description: Profile setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSetupState"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      operationId: saveProfileSetupStep
      tags: [profileSetup]
      summary: Save one profile setup step
      description: >
        Saves one of the five profile information steps. Progress is persisted
        so the user can leave and continue later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSetupStepInput"
      responses:
        "200":
          description: Profile setup step saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSetupStepResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /profile/setup/complete:
    post:
      operationId: completeProfileSetup
      tags: [profileSetup]
      summary: Complete profile onboarding
      description: >
        Marks the profile as complete after all five information steps
        and a primary profile photo have been saved.
      responses:
        "200":
          description: Profile setup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSetupCompleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /profile/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the current user's profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Create or update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /profile/visibility:
    put:
      operationId: updateProfileVisibility
      tags: [profiles]
      summary: Update the current user's profile visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisibilityInput"
      responses:
        "200":
          description: Updated visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: Search public profiles with server-side filters and pagination
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"

        - in: query
          name: gender
          schema:
            type: string

        - in: query
          name: ageMin
          schema:
            type: integer
            minimum: 18

        - in: query
          name: ageMax
          schema:
            type: integer
            minimum: 18

        - in: query
          name: heightMin
          schema:
            type: integer
            minimum: 100

        - in: query
          name: heightMax
          schema:
            type: integer
            minimum: 100

        - in: query
          name: location
          schema:
            type: string

        - in: query
          name: district
          schema:
            type: string

        - in: query
          name: education
          schema:
            type: string

        - in: query
          name: profession
          schema:
            type: string

        - in: query
          name: community
          schema:
            type: string

        - in: query
          name: maritalStatus
          schema:
            type: string

      responses:
        "200":
          description: Paginated public profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"


  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a public profile without private contact information
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"


  /profiles/{id}/interest:
    post:
      operationId: expressInterest
      tags: [interests]
      summary: Express interest in a public profile
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "201":
          description: Interest created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Interest already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /interests:
    get:
      operationId: listInterests
      tags: [interests]
      summary: List sent and received interests
      responses:
        "200":
          description: Interests grouped by direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestList"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /interests/{id}:
    put:
      operationId: updateInterest
      tags: [interests]
      summary: Accept or decline an incoming interest
      parameters:
        - $ref: "#/components/parameters/InterestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestUpdate"
      responses:
        "200":
          description: Updated interest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /photos:
    post:
      operationId: uploadPhoto
      tags: [photos]
      summary: Upload a profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUploadInput"
      responses:
        "201":
          description: Uploaded photo metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /photos/{id}:
    delete:
      operationId: deletePhoto
      tags: [photos]
      summary: Delete an owned photo
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "204":
          description: Photo deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      operationId: updatePhoto
      tags: [photos]
      summary: Set photo order or primary status
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUpdate"
      responses:
        "200":
          description: Updated photo metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /photos/complete:
    post:
      operationId: completePhotoUpload
      tags: [photos]
      summary: Save photo metadata after a successful object upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoCompleteInput"
      responses:
        "201":
          description: Saved photo metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Report a profile for moderation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [photos]
      summary: Request a private object storage upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"


  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get moderation statistics
      responses:
        "200":
          description: Admin statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /admin/reports:
    get:
      operationId: listAdminReports
      tags: [admin]
      summary: List profile reports for review
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /admin/reports/{id}:
    patch:
      operationId: updateAdminReport
      tags: [admin]
      summary: Update the moderation status of a profile report
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReportUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


  /admin/users/{id}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [admin]
      summary: Activate or suspend a member account
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusUpdate"
      responses:
        "200":
          description: Updated user account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


components:

  parameters:

    ProfileId:
      in: path
      name: id
      required: true
      schema:
        type: string

    InterestId:
      in: path
      name: id
      required: true
      schema:
        type: string

    PhotoId:
      in: path
      name: id
      required: true
      schema:
        type: string

    ReportId:
      in: path
      name: id
      required: true
      schema:
        type: string

    UserId:
      in: path
      name: id
      required: true
      schema:
        type: string

    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 24
        default: 12


  responses:

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"


  schemas:

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status


    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error


    DashboardSummary:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/MyProfile"

        sentInterests:
          type: integer

        receivedInterests:
          type: integer

        acceptedInterests:
          type: integer

        recentProfiles:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfile"

      required:
        - profile
        - sentInterests
        - receivedInterests
        - acceptedInterests
        - recentProfiles


    ProfileInput:
      type: object

      properties:

        fullName:
          type: string
          minLength: 2

        dateOfBirth:
          type: string
          format: date

        gender:
          type: string

        phone:
          type: string

        address:
          type: string

        height:
          type: integer
          minimum: 50
          maximum: 250

        maritalStatus:
          type: string

        religion:
          type: string

        community:
          type: string

        caste:
          type: string

        subCaste:
          type: string

        ethnicBackground:
          type: string

        motherTongue:
          type: string

        state:
          type: string

        district:
          type: string

        currentCity:
          type: string

        nativePlace:
          type: string

        about:
          type: string
          maxLength: 1200

        education:
          type: string

        qualifications:
          type: string

        college:
          type: string

        profession:
          type: string

        jobTitle:
          type: string

        company:
          type: string

        workLocation:
          type: string

        employmentDetails:
          type: string

        incomeRange:
          type: string

        visaWorkStatus:
          type: string

        bodyType:
          type: string

        appearance:
          type: string

        lifestyleInformation:
          type: string
          maxLength: 1200

        smoking:
          type: string

        drinking:
          type: string

        foodPreferences:
          type: string

        healthInformation:
          type: string
          maxLength: 1200

        fatherOccupation:
          type: string

        fatherStatus:
          type: string

        motherOccupation:
          type: string

        motherStatus:
          type: string

        siblingsCount:
          type: integer
          minimum: 0

        brothersCount:
          type: integer
          minimum: 0

        sistersCount:
          type: integer
          minimum: 0

        marriedSiblingsCount:
          type: integer
          minimum: 0

        unmarriedSiblingsCount:
          type: integer
          minimum: 0

        familyType:
          type: string

        familyInformation:
          type: string
          maxLength: 1200

        hobbies:
          type: string

        languages:
          type: string

        culturalInterests:
          type: string

        familyValues:
          type: string

        visibility:
          type: string
          enum: [public, private]

        preferredAgeMin:
          type: integer
          minimum: 18

        preferredAgeMax:
          type: integer
          minimum: 18

        preferredHeightMin:
          type: integer
          minimum: 50

        preferredHeightMax:
          type: integer
          minimum: 50

        preferredLocation:
          type: string

        preferredDistrict:
          type: string

        preferredReligion:
          type: string

        preferredCaste:
          type: string

        preferredEducation:
          type: string

        preferredProfession:
          type: string

        preferredCommunity:
          type: string

        preferredIncomeRange:
          type: string

        preferredMaritalStatus:
          type: string

        preferredFamilyValues:
          type: string

        otherPreferences:
          type: string
          maxLength: 1200

      required:
        - fullName
        - dateOfBirth
        - gender


    MyProfile:
      allOf:

        - $ref: "#/components/schemas/PublicProfile"

        - type: object

          properties:

            email:
              type: string
              format: email

            visibility:
              type: string
              enum: [public, private]

            completion:
              type: integer
              minimum: 0
              maximum: 100

            dateOfBirth:
              type: string
              format: date

            phone:
              type: string

            address:
              type: string

            religion:
              type: string

            community:
              type: string

            caste:
              type: string

            subCaste:
              type: string

            ethnicBackground:
              type: string

            motherTongue:
              type: string

            state:
              type: string

            currentCity:
              type: string

            district:
              type: string

            nativePlace:
              type: string

            qualifications:
              type: string

            college:
              type: string

            profession:
              type: string

            jobTitle:
              type: string

            company:
              type: string

            workLocation:
              type: string

            employmentDetails:
              type: string

            incomeRange:
              type: string

            visaWorkStatus:
              type: string

            bodyType:
              type: string

            appearance:
              type: string

            lifestyleInformation:
              type: string
              maxLength: 1200

            smoking:
              type: string

            drinking:
              type: string

            foodPreferences:
              type: string

            healthInformation:
              type: string
              maxLength: 1200

            fatherOccupation:
              type: string

            fatherStatus:
              type: string

            motherOccupation:
              type: string

            motherStatus:
              type: string

            siblingsCount:
              type: integer
              minimum: 0

            brothersCount:
              type: integer
              minimum: 0

            sistersCount:
              type: integer
              minimum: 0

            marriedSiblingsCount:
              type: integer
              minimum: 0

            unmarriedSiblingsCount:
              type: integer
              minimum: 0

            familyType:
              type: string

            familyInformation:
              type: string
              maxLength: 1200

            hobbies:
              type: string

            languages:
              type: string

            culturalInterests:
              type: string

            familyValues:
              type: string

            preferences:
              $ref: "#/components/schemas/PartnerPreferences"

          required:
            - email
            - visibility
            - completion
            - preferences


    PublicProfile:
      type: object

      properties:

        id:
          type: string

        fullName:
          type: string

        age:
          type: integer

        gender:
          type: string

        height:
          type: integer

        city:
          type: string

        district:
          type: string

        nativePlace:
          type: string

        education:
          type: string

        profession:
          type: string

        community:
          type: string

        maritalStatus:
          type: string

        about:
          type: string

        familyValues:
          type: string

        hobbies:
          type: string

        languages:
          type: string

        photoUrl:
          type: ["string", "null"]
          format: uri

        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"

      required:
        - id
        - fullName
        - age
        - gender
        - city
        - education
        - profession
        - community
        - about
        - photoUrl
        - photos


    PartnerPreferences:
      type: object

      properties:

        preferredAgeMin:
          type: ["integer", "null"]

        preferredAgeMax:
          type: ["integer", "null"]

        preferredHeightMin:
          type: ["integer", "null"]

        preferredHeightMax:
          type: ["integer", "null"]

        preferredLocation:
          type: ["string", "null"]

        preferredDistrict:
          type: ["string", "null"]

        preferredReligion:
          type: ["string", "null"]

        preferredCaste:
          type: ["string", "null"]

        preferredEducation:
          type: ["string", "null"]

        preferredProfession:
          type: ["string", "null"]

        preferredCommunity:
          type: ["string", "null"]

        preferredIncomeRange:
          type: ["string", "null"]

        preferredMaritalStatus:
          type: ["string", "null"]

        preferredFamilyValues:
          type: ["string", "null"]

        otherPreferences:
          type: ["string", "null"]

      required:
        - preferredAgeMin
        - preferredAgeMax
        - preferredHeightMin
        - preferredHeightMax
        - preferredLocation
        - preferredDistrict
        - preferredReligion
        - preferredCaste
        - preferredEducation
        - preferredProfession
        - preferredCommunity
        - preferredIncomeRange
        - preferredMaritalStatus
        - preferredFamilyValues
        - otherPreferences


    ProfileList:
      type: object

      properties:

        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfile"

        page:
          type: integer

        pageSize:
          type: integer

        total:
          type: integer

        totalPages:
          type: integer

      required:
        - items
        - page
        - pageSize
        - total
        - totalPages


    ProfileSetupStepInput:
      type: object

      properties:

        step:
          type: integer
          minimum: 1
          maximum: 5

        data:
          type: object
          additionalProperties: true

      required:
        - step
        - data


    ProfileSetupStepResponse:
      type: object

      properties:

        success:
          type: boolean

        step:
          type: integer

        nextStep:
          type: integer

        profileSetupCompleted:
          type: boolean

      required:
        - success
        - step
        - nextStep
        - profileSetupCompleted


    ProfileSetupState:
      type: object

      properties:

        profileExists:
          type: boolean

        profileSetupCompleted:
          type: boolean

        currentStep:
          type: integer

        profile:
          anyOf:
            - $ref: "#/components/schemas/ProfileSetupProfile"
            - type: "null"

        preferences:
          anyOf:
            - $ref: "#/components/schemas/ProfileSetupPreferences"
            - type: "null"

        photoCount:
          type: integer

        hasPrimaryPhoto:
          type: boolean

      required:
        - profileExists
        - profileSetupCompleted
        - currentStep
        - profile
        - preferences
        - photoCount
        - hasPrimaryPhoto


    ProfileSetupProfile:
      type: object

      properties:

        id:
          type: string

        fullName:
          type: string

        dateOfBirth:
          type: string
          format: date

        age:
          type: integer

        gender:
          type: string

        phone:
          type: ["string", "null"]

        email:
          type: string
          format: email

        address:
          type: ["string", "null"]

        currentCity:
          type: ["string", "null"]

        state:
          type: ["string", "null"]

        district:
          type: ["string", "null"]

        religion:
